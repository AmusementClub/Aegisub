name: Aegisub CI

on:
  push:
    branches: [exp]
  pull_request:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-2025-vs2026
    env:
      PROJECT_VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      PROJECT_VCPKG_INSTALLED_ROOT: ${{ github.workspace }}\vcpkg_installed
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKG_DISABLE_METRICS: '1'
    steps:
    - name: checkout code
      uses: actions/checkout@v6

    - name: read vcpkg baseline
      id: vcpkg-baseline
      shell: pwsh
      run: |
        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        "ref=$baseline" >> $env:GITHUB_OUTPUT

    - name: checkout vcpkg
      uses: actions/checkout@v6
      with:
        repository: microsoft/vcpkg
        ref: ${{ steps.vcpkg-baseline.outputs.ref }}
        path: vcpkg
        fetch-depth: 1

    - name: setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: restore vcpkg installed cache
      id: restore-vcpkg-installed
      uses: actions/cache/restore@v5
      with:
        path: ${{ env.PROJECT_VCPKG_INSTALLED_ROOT }}
        key: windows-vcpkg-installed-x64-windows-release-${{ hashFiles('vcpkg.json', 'cmake/x64-windows-release.cmake') }}
        restore-keys: |
          windows-vcpkg-installed-x64-windows-release-

    - name: cache portable dependencies
      uses: actions/cache@v5
      with:
        path: .cache/package-win-portable
        key: portable-deps-${{ runner.os }}-${{ hashFiles('build/package-win-portable.cs', 'build/package-win-portable.thirdparty.json') }}
        restore-keys: |
          portable-deps-${{ runner.os }}-

    - name: bootstrap vcpkg
      shell: pwsh
      run: |
        & "$env:PROJECT_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

    - name: install vcpkg dependencies
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path $env:PROJECT_VCPKG_INSTALLED_ROOT | Out-Null
        & "$env:PROJECT_VCPKG_ROOT\vcpkg.exe" install `
          --triplet $env:VCPKG_DEFAULT_TRIPLET `
          --clean-after-build `
          --x-install-root "$env:PROJECT_VCPKG_INSTALLED_ROOT" `
          --x-manifest-root "$env:GITHUB_WORKSPACE"

    - name: prepare portable dependencies
      shell: pwsh
      run: |
        dotnet build/package-win-portable.cs -- --mode prepare-dependency --cache-dir .cache/package-win-portable

    - name: save vcpkg installed cache
      if: success() && steps.restore-vcpkg-installed.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ env.PROJECT_VCPKG_INSTALLED_ROOT }}
        key: ${{ steps.restore-vcpkg-installed.outputs.cache-primary-key }}

    - name: build
      id: build
      shell: pwsh
      run: |
        ./build/build-win-vcpkg.ps1 -Mode build -VcpkgRoot $env:PROJECT_VCPKG_ROOT -VcpkgInstalledRoot $env:PROJECT_VCPKG_INSTALLED_ROOT

    - name: test
      id: test
      if: success()
      continue-on-error: true
      shell: pwsh
      run: |
        ./build/build-win-vcpkg.ps1 -Mode test -VcpkgRoot $env:PROJECT_VCPKG_ROOT -VcpkgInstalledRoot $env:PROJECT_VCPKG_INSTALLED_ROOT

    - name: package portable
      id: package
      if: always() && steps.build.outcome == 'success'
      shell: pwsh
      run: |
        dotnet build/package-win-portable.cs -- --mode package --build-dir build-dir/Release --cache-dir .cache/package-win-portable

    - name: upload artifact
      if: always() && steps.package.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: aegisub-win-x64-portable.zip
        path: artifacts/win-portable/aegisub-portable.zip

    - name: fail on test error
      if: always() && steps.test.outcome == 'failure'
      shell: pwsh
      run: |
        throw 'Tests failed.'
